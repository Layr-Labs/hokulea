[package]
name = "canoe-verifier"
description = "Eigenda canoe verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
eigenda-cert.workspace = true
alloy-primitives = { workspace = true }
serde.workspace = true
thiserror.workspace = true

# Only the chain-spec helpers require the Reth execution stack.
revm-primitives = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
alloy-genesis = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = ["chain-spec"]
chain-spec = ["dep:revm-primitives", "dep:reth-chainspec", "dep:reth-evm", "dep:alloy-genesis"]
