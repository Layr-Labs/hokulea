[package]
name = "canoe-verifier"
description = "Eigenda canoe verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
eigenda-cert.workspace = true
alloy-primitives = { workspace = true }
serde.workspace = true
thiserror.workspace = true

# canoe verifies the EigenDA cert via an L1 view-call on the reth-2.2.0 / revm-38
# stack (shared with sp1-cc), now on alloy 2.x. These types must match reth's, so
# they track the workspace's alloy-2.x / revm-23 pins (also used on the Kona side).
revm-primitives = { workspace = true }
reth-chainspec = { workspace = true }
reth-evm = { workspace = true }
alloy-genesis = { workspace = true }
tracing = { workspace = true }